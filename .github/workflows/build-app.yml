# Builds the desktop app (root/scanned-to-object) for Windows and macOS.
# - Every run: download the builds from the run's "Artifacts" section.
# - Pushing a tag like v0.1.0: the builds are also attached to a GitHub Release.
name: Build desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: root/scanned-to-object
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libusb (macOS, required by Open3D)
        if: runner.os == 'macOS'
        run: brew install libusb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build app
        run: pyinstaller --noconfirm build.spec

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/ScanToLimbModel -DestinationPath ScanToLimbModel-windows.zip

      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/ScanToLimbModel.app ScanToLimbModel-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ScanToLimbModel-${{ matrix.name }}
          path: root/scanned-to-object/ScanToLimbModel-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
